<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        .main{
            max-width: 1320px;
            margin: auto;
            display: grid;
            grid-template-columns: 20% 1fr 1fr;
            grid-template-rows: 100px 200px 200px 100px;
        }
        header,footer{
            background-color: green;
            grid-column-start: 1;
            grid-column-end: 4;
            text-align: center;
            font-size: 40px;
            color: white;
            text-transform: capitalize;
        }
        aside{
            background-color: pink;
            grid-row: 2/4;
        }
        #ab{
            background-color: orange;
            grid-column: 2/4;
        }
        #abc{
            background-color: aqua;
        }
        #abcd{
            background-color: palegreen;
        }
    </style>
</head>
<body>
    <div class="main">
        <header>header</header>
        <aside>Sidebar</aside>
        <div id="ab">content 1</div>
        <div id="abc">content 2</div>
        <div id="abcd">content 3</div>
        <footer>footer</footer>
    </div>
</body>
</html>
